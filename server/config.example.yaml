# FileToaster configuration example.
# Copy to config.yaml (or a path given via --config-file / FILETOASTER_CONFIG)
# and adjust. All settings except admin_password_hash, admin_user, and
# session_secret can also be overridden with environment variables (see
# AGENTS.md). admin_password_hash is derived at runtime from
# FILETOASTER_ADMIN_PASSWORD when that env var is set.

# Bind address for the HTTP server, e.g. ":8080" or "127.0.0.1:8080".
addr: ":8080"

# Directories the server is allowed to serve. Every file operation is confined
# to these roots; anything outside is rejected (path-traversal protection).
# Each entry is rendered on the frontend as one folder icon labeled by `name`,
# and opens the directory given by `path` (an absolute path) or `env` (the name
# of an environment variable whose value is a single absolute directory path).
# `name` is mandatory; at least one of `path` or `env` must be set. When both
# are present, `path` takes precedence. The resolved directory must exist and be
# a real directory (checked at server start).
allowed_paths:
    - name: Documents
      path: /data/documents
    - name: SharedDrive
      env: SHARED_DRIVE_PATH

# Maximum number of tasks allowed to run in parallel. Extra tasks wait in an
# in-memory queue.
max_parallel_tasks: 4

# Graceful shutdown: how many seconds the server lets running operations finish
# after a SIGINT/SIGTERM before forcibly cancelling them and exiting. Set to 0
# to cancel running operations immediately on shutdown.
shutdown_timeout_seconds: 30

# Set to true to enable debug-level logging (defaults to info logging).
debug: false

# Set GOMAXPROCS to this value. 0 (the default) leaves it to the Go runtime.
gomaxprocs: 0

# Directory used to stage uploads. Deliberately OUTSIDE the served roots so
# incomplete uploads never appear in listings. When left at the built-in default
# (<home>/.filetoaster/tmp_uploads) it is created on start if missing. If you set
# a custom path here it must already exist: the server refuses to start if it is
# missing or not a directory, and never auto-creates it.
tmp_dir: /tmp/filetoaster-uploads

# Fixed size, in bytes, of each per-file upload chunk. The client slices files
# with this value and re-sends only missing chunks, so the client and server
# must agree (the client reads it from GET /api/config). Default 4 MiB.
upload_chunk_size: 4194304

# Maximum number of upload chunks sent at once, across every file and session
# (a global limit, not per file). Caps simultaneous upload requests in the
# browser to avoid resource-exhaustion failures when uploading large files.
# Default 4.
upload_max_concurrent_chunks: 4

# How many hours a staged upload is tolerated before the background sweep removes
# its staging dir and in-memory session. Must be at least 1 hour; 0 or negative
# makes the sweep remove every staged upload at once, defeating resume.
# Default 24.
upload_stale_after: 24

# How often the background upload sweep runs, in hours. Must be at least 1.
# Default 1.
upload_sweep_interval: 1

# HMAC secret used to sign the session cookie. Required. Prefer setting it via
# the FILETOASTER_SESSION_SECRET environment variable.
session_secret: "change-me-in-production"

# Admin username accepted at login.
admin_user: admin

# Argon2id hash of the admin password. Override at runtime with the
# FILETOASTER_ADMIN_PASSWORD environment variable, which takes precedence over
# this value and over the default admin password.
admin_password_hash: ""
